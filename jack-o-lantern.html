<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUMPKIN - Jack-o'-Lantern</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(() => {
  // Layout is in "world units": pumpkin centre at (0, 0), about 200 units wide.
  const WORD = 'PUMPKIN';
  const FONT_FAMILY = "'Arial Black', Impact, 'Segoe UI', sans-serif";

  // Body colors run light (centre) to dark (edge) so the pumpkin reads as round.
  const BODY_SHADES = ['#ffb347', '#ffa02e', '#ff8c1a', '#ff7a00', '#e85d04', '#c44a00'];
  const ACCENT_COLORS = ['#ffd23f', '#f4a261', '#d9480f', '#b5651d', '#ff6b1a'];
  const FACE_COLORS = ['#fff3a0', '#ffe066', '#ffd60a', '#ffffff', '#ffb703'];
  const STEM_COLORS = ['#70e000', '#38b000', '#9ef01a'];
  const ACCENT_SHARE = 0.1;

  // Three overlapping lobes give the silhouette its pumpkin dip at the top and bottom.
  const LOBES = [
    { cx: -46, rx: 54, ry: 82 },
    { cx: 0, rx: 50, ry: 86 },
    { cx: 46, rx: 54, ry: 82 }
  ];
  const BODY_HALF_WIDTH = 100;
  const BODY_HALF_HEIGHT = 86;
  const EDGE_SCALE = 0.995;      // words run right up to the outline

  const SIZE_MIN = 2.4;          // row font sizes: small enough to be barely readable
  const SIZE_MAX = 3.8;
  const MIN_FIT_SIZE = 1.5;      // smallest word squeezed into a narrow run
  const CAP_RATIO = 0.82;        // row box height as a fraction of font size
  const ROW_STEP = 0.92;         // row pitch as a fraction of font size
  const ROW_SAMPLES = 4;         // vertical samples used to test a column of a row
  const SCAN_STEP = 0.25;        // horizontal resolution when measuring where a row starts and ends
  const RUN_INSET = 0.15;        // gap kept between a run's words and its boundary
  const WORD_GAP = 0.9;
  const SCAN_MARGIN = 5;
  const STEM_SIZE = 2.6;
  const STEM_TOP = -112;
  const STEM_LEAN = 0.1;

  const RING_WIDTH = 4;          // thickness of each reveal ring, about one row of words
  const DEPTH_RAYS = 24;         // directions probed when measuring distance to the edge
  const DEPTH_STEP = 1;
  const DEPTH_MAX = 130;
  const BUILD_MS = 5000;        // total time to place every word
  const WORD_IN_MS = 220;        // pop-in duration per word
  const GLOW_IN_MS = 900;        // fade-in of the face glow
  const MEASURE_SIZE = 100;
  const VIEW_UNITS = 235;        // world units that fit the shorter screen side
  const VIEW_SHIFT = 13;         // moves the pumpkin down so body + stem are centred
  // Face glow: shadow blur radius (world units) and how many times each pass is stacked.
  const GLOW_PASSES = [
    { blur: 5, repeats: 3 },
    { blur: 2.5, repeats: 3 },
    { blur: 1, repeats: 2 }
  ];
  const GLOW_STROKE = 0.7;     // thickens the thin glyphs so they cast a stronger glow

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const glowLayer = document.createElement('canvas');

  // Optional ?t=<ms> freezes the animation at that moment (for previews).
  const FROZEN_PARAM = new URLSearchParams(window.location.search).get('t');
  const FROZEN_MS = FROZEN_PARAM === null ? null : Number(FROZEN_PARAM);

  let frameCount = 0;
  let unit = 1;                  // device pixels per world unit
  let layout = [];
  let buildEnd = 0;
  let startTime = 0;

  const rand = (min, max) => min + Math.random() * (max - min);
  const pick = (items) => items[Math.floor(Math.random() * items.length)];
  const clamp01 = (v) => Math.min(1, Math.max(0, v));

  const easeOutBack = (p) => {
    const c1 = 1.4;
    const c3 = c1 + 1;
    return 1 + c3 * (p - 1) ** 3 + c1 * (p - 1) ** 2;
  };

  // Quadratic bezier sampled into a polygon.
  const curve = (p0, c, p1, steps = 12) =>
    Array.from({ length: steps + 1 }, (_, i) => {
      const t = i / steps;
      const u = 1 - t;
      return [
        u * u * p0[0] + 2 * u * t * c[0] + t * t * p1[0],
        u * u * p0[1] + 2 * u * t * c[1] + t * t * p1[1]
      ];
    });

  // Carved face: words inside these shapes become the bright, glowing ones.
  const TEETH = Array.from({ length: 13 }, (_, i) => [-72 + i * 12, i % 2 ? 30 : 16]);
  const FACE_POLYS = [
    [[-68, -12], [-24, -12], [-46, -56]],          // left eye
    [[24, -12], [68, -12], [46, -56]],             // right eye
    [[-11, 16], [11, 16], [0, -6]],                // nose
    [...TEETH, ...curve([72, 16], [0, 80], [-72, 16])] // grin
  ];

  const measureCtx = document.createElement('canvas').getContext('2d');
  measureCtx.font = `900 ${MEASURE_SIZE}px ${FONT_FAMILY}`;
  const MEASURE_BASE = measureCtx.measureText(WORD).width;
  const wordWidth = (size) => (MEASURE_BASE * size) / MEASURE_SIZE;
  const sizeForWidth = (width) => (width * MEASURE_SIZE) / MEASURE_BASE;

  const inBody = (x, y) =>
    LOBES.some((lobe) => ((x - lobe.cx) / (lobe.rx * EDGE_SCALE)) ** 2 + (y / (lobe.ry * EDGE_SCALE)) ** 2 <= 1);

  const inPoly = (x, y, poly) => {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i];
      const [xj, yj] = poly[j];
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) {
        inside = !inside;
      }
    }
    return inside;
  };

  const inFace = (x, y) => FACE_POLYS.some((poly) => inPoly(x, y, poly));

  // Which zone a full-height column of the row at `x` belongs to: 'face', 'body',
  // or null when it leaves the body or straddles a face border.
  const columnZone = (x, y, height) => {
    let hasFace = false;
    let hasBody = false;
    for (let j = 0; j <= ROW_SAMPLES; j++) {
      const sampleY = y - height / 2 + (height * j) / ROW_SAMPLES;
      if (!inBody(x, sampleY)) return null;
      if (inFace(x, sampleY)) hasFace = true;
      else hasBody = true;
    }
    if (hasFace && hasBody) return null;
    return hasFace ? 'face' : 'body';
  };

  // Maximal x-intervals of the row that stay in one zone. Words are fitted to
  // these exactly, which is what makes the outline and face borders crisp.
  const findRuns = (y, height) => {
    const runs = [];
    let current = null;
    for (let x = -BODY_HALF_WIDTH - SCAN_MARGIN; x <= BODY_HALF_WIDTH + SCAN_MARGIN; x += SCAN_STEP) {
      const zone = columnZone(x, y, height);
      if (current && zone === current.zone) {
        current.end = x;
        continue;
      }
      if (current) runs.push(current);
      current = zone ? { zone, start: x, end: x } : null;
    }
    if (current) runs.push(current);
    return runs;
  };

  const colorFor = (zone, x, y) => {
    if (zone === 'face') return pick(FACE_COLORS);
    if (Math.random() < ACCENT_SHARE) return pick(ACCENT_COLORS);
    const radius = Math.hypot(x / BODY_HALF_WIDTH, y / BODY_HALF_HEIGHT);
    const index = Math.round(radius * (BODY_SHADES.length - 2) + rand(-1, 1));
    return BODY_SHADES[Math.min(BODY_SHADES.length - 1, Math.max(0, index))];
  };

  // Fill a run edge to edge: as many words as fit at the row size, shrunk
  // just enough that the first and last word touch the run's boundaries.
  const fillRun = (run, y, rowSize) => {
    const start = run.start + RUN_INSET;
    const length = run.end - run.start - 2 * RUN_INSET;
    const count = Math.max(1, Math.ceil((length + WORD_GAP) / (wordWidth(rowSize) + WORD_GAP)));
    const width = (length - (count - 1) * WORD_GAP) / count;
    const size = sizeForWidth(width);
    if (size < MIN_FIT_SIZE) return [];

    return Array.from({ length: count }, (_, i) => {
      const x = start + width / 2 + i * (width + WORD_GAP);
      return { x, y, size, color: colorFor(run.zone, x, y), zone: run.zone };
    });
  };

  const buildBody = () => {
    const placed = [];
    let top = -BODY_HALF_HEIGHT;
    while (top < BODY_HALF_HEIGHT) {
      const rowSize = rand(SIZE_MIN, SIZE_MAX);
      const y = top + rowSize / 2;
      for (const run of findRuns(y, rowSize * CAP_RATIO)) {
        placed.push(...fillRun(run, y, rowSize));
      }
      top += rowSize * ROW_STEP;
    }
    return placed;
  };

  // A short leaning stack of green words of equal width, built bottom to top.
  const buildStem = () => {
    const placed = [];
    const baseY = -BODY_HALF_HEIGHT + 2;
    for (let y = baseY; y > STEM_TOP; y -= STEM_SIZE * ROW_STEP) {
      placed.push({
        x: (baseY - y) * STEM_LEAN,
        y,
        size: STEM_SIZE,
        color: pick(STEM_COLORS),
        zone: 'stem'
      });
    }
    return placed;
  };

  // Distance from a point to the pumpkin's edge: the shortest ray that leaves the body.
  const edgeDistance = (x, y) => {
    let shortest = DEPTH_MAX;
    for (let k = 0; k < DEPTH_RAYS; k++) {
      const angle = (k / DEPTH_RAYS) * Math.PI * 2;
      const dx = Math.cos(angle);
      const dy = Math.sin(angle);
      let length = 0;
      while (length < shortest && inBody(x + dx * length, y + dy * length)) length += DEPTH_STEP;
      shortest = Math.min(shortest, length);
    }
    return shortest;
  };

  // Reveal order: ring by ring from the outline inward, each ring looping
  // clockwise from the top, so the border is traced first and then filled up.
  const orderOutsideIn = (words) =>
    words
      .map((word) => ({
        word,
        ring: Math.floor(edgeDistance(word.x, word.y) / RING_WIDTH),
        turn: (Math.atan2(word.x, -word.y) + Math.PI * 2) % (Math.PI * 2)
      }))
      .sort((a, b) => a.ring - b.ring || a.turn - b.turn)
      .map((entry) => entry.word);

  const buildLayout = () => {
    const words = [...orderOutsideIn(buildBody()), ...buildStem()];
    const interval = BUILD_MS / words.length;
    buildEnd = BUILD_MS + WORD_IN_MS;
    return words.map((word, i) => ({ ...word, start: i * interval }));
  };

  const setWorldTransform = (target) =>
    target.setTransform(unit, 0, 0, unit, canvas.width / 2, canvas.height / 2 + VIEW_SHIFT * unit);

  const setWordFont = (target, size) => {
    target.font = `900 ${size}px ${FONT_FAMILY}`;
    target.textAlign = 'center';
    target.textBaseline = 'middle';
  };

  // Pre-render the blurred glow of the face words once; the main loop only
  // composites it, so the glow stays cheap even with hundreds of words.
  const rebuildGlow = () => {
    glowLayer.width = canvas.width;
    glowLayer.height = canvas.height;
    const g = glowLayer.getContext('2d');
    const faceWords = layout.filter((word) => word.zone === 'face');

    setWorldTransform(g);
    g.shadowColor = 'rgba(255, 150, 0, 1)';
    g.fillStyle = '#ffd60a';
    g.strokeStyle = '#ffd60a';
    g.lineWidth = GLOW_STROKE;
    for (const { blur, repeats } of GLOW_PASSES) {
      g.shadowBlur = blur * unit;
      for (let r = 0; r < repeats; r++) {
        for (const word of faceWords) {
          setWordFont(g, word.size);
          g.fillText(WORD, word.x, word.y);
          g.strokeText(WORD, word.x, word.y);
        }
      }
    }
  };

  const resize = () => {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    unit = (Math.min(window.innerWidth, window.innerHeight) / VIEW_UNITS) * dpr;
    frameCount = 0; // a frozen preview redraws once after every resize
    rebuildGlow();
  };

  const drawWord = (word, elapsed) => {
    const local = elapsed - word.start;
    if (local < 0) return;
    const progress = clamp01(local / WORD_IN_MS);
    const scale = easeOutBack(progress);

    ctx.save();
    ctx.globalAlpha = progress;
    ctx.fillStyle = word.color;
    setWordFont(ctx, word.size);
    ctx.translate(word.x, word.y);
    ctx.scale(scale, scale);
    ctx.fillText(WORD, 0, 0);
    ctx.restore();
  };

  const drawGlow = (level) => {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.min(1, level);
    ctx.drawImage(glowLayer, 0, 0);
    ctx.restore();
  };

  const render = (now) => {
    // A frozen preview is drawn once; the loop keeps ticking without redrawing.
    if (FROZEN_MS !== null && frameCount > 0) {
      requestAnimationFrame(render);
      return;
    }
    const elapsed = FROZEN_MS ?? now - startTime;
    const glow = clamp01((elapsed - buildEnd) / GLOW_IN_MS);
    const flicker = 0.92 + 0.08 * Math.sin(elapsed / 140) + rand(-0.02, 0.02);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    setWorldTransform(ctx);
    for (const word of layout) drawWord(word, elapsed);
    if (glow > 0) drawGlow(glow * flicker);

    frameCount += 1;
    requestAnimationFrame(render);
  };

  const replay = () => {
    layout = buildLayout();
    rebuildGlow();
    frameCount = 0;
    startTime = performance.now();
  };

  window.addEventListener('resize', resize);
  canvas.addEventListener('click', replay);

  resize();
  replay();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
